[info]
name = "Atlas"
version = "1.15.1"
author = "ionm"
description = "The Atomic Clock Atlas design system: warm paper, ink, a single oxblood accent; EB Garamond, IBM Plex Sans and IBM Plex Mono; hairlines instead of boxes."
theme_link = "https://github.com/ionm/omeka-s-theme-atlas"
author_link = "https://github.com/ionm"
omeka_version_constraint = "^4.2.0"

helpers[] = "AtlasFacetLinks"
helpers[] = "AtlasBibkeys"
helpers[] = "AtlasEssay"

[config]
elements.tagline.name = "tagline"
elements.tagline.type = "Text"
elements.tagline.options.label = "Tagline"
elements.tagline.options.info = "Italic line under the wordmark in the masthead."
elements.tagline.attributes.value = "A digital inventory and exhibition of the history of atomic timekeeping."

elements.masthead_image.name = "masthead_image"
elements.masthead_image.type = "Omeka\Form\Element\Asset"
elements.masthead_image.options.label = "Masthead engraving"
elements.masthead_image.options.info = "The image shown in the masthead, and the placeholder for entries without one. Upload it under Assets first. No image ships with the theme; leave this empty and the masthead and placeholders simply render without one."

elements.nav_depth.name = "nav_depth"
elements.nav_depth.attributes.id = "nav_depth"
elements.nav_depth.type = "Number"
elements.nav_depth.options.label = "Top navigation depth"
elements.nav_depth.options.info = "Maximum number of levels to show in the site's top navigation. Set to 0 to show all levels."
elements.nav_depth.attributes.min = 0
elements.nav_depth.attributes.value = 1

elements.placeholder_label.name = "placeholder_label"
elements.placeholder_label.type = "Text"
elements.placeholder_label.options.label = "Placeholder caption"
elements.placeholder_label.options.info = "Mono caption shown under the engraving when an entry has no image."
elements.placeholder_label.attributes.value = "no image in inventory"

elements.placeholder_templates.name = "placeholder_templates"
elements.placeholder_templates.type = "Text"
elements.placeholder_templates.options.label = "Placeholder for these resource templates"
elements.placeholder_templates.options.info = "Comma-separated template labels. Entries using one of them get the engraving placeholder when they have no image; other image-less entries (references, institutions) get no plates - their left column holds just the linked entries."
elements.placeholder_templates.attributes.value = "Clock"

elements.citation_properties.name = "citation_properties"
elements.citation_properties.type = "Text"
elements.citation_properties.options.label = "Show linked resources as citations for these properties"
elements.citation_properties.options.info = "Comma-separated property terms (e.g. dcterms:references, aclocks:documentation). Resource links in these properties are rendered as a full bibliographic citation (Bibliography module) instead of a bare title. Leave empty to show titles."
elements.citation_properties.attributes.value = "dcterms:references"

elements.citation_sort.name = "citation_sort"
elements.citation_sort.type = "Checkbox"
elements.citation_sort.options.label = "Order citations alphabetically"
elements.citation_sort.options.info = "A References block is a bibliography, so its entries are sorted by the rendered citation - which in an author-date style means by first author, then year, then title. Untick to keep the order the values are stored in (the order Libra's field held them at import). Applies to every property listed above in \"Show linked resources as citations\"."
elements.citation_sort.attributes.value = 1

elements.section_templates.name = "section_templates"
elements.section_templates.type = "Text"
elements.section_templates.options.label = "Sectioned metadata for these resource templates"
elements.section_templates.options.info = "Comma-separated template labels. Their entry pages group the metadata under section headings (see below) and print the alternative title under the title. Other templates keep the plain table."
elements.section_templates.attributes.value = "Clock"

elements.entry_sections.name = "entry_sections"
elements.entry_sections.type = "Textarea"
elements.entry_sections.options.label = "Entry page sections"
elements.entry_sections.options.info = "One property term per line under a \"# Section heading\" line; append \" = Label\" to relabel a property on the page. A section with a single property is shown as a plain row (no heading); a section of citation properties shows the heading followed by the citations. Special term: dcterms:spatial#institution (values of dcterms:spatial that are not the host institution's city). Leave empty for the theme's built-in mapping (Technical characteristics / Development and history / Location and provenance / Repository record / References). If the resource template defines property groups (Advanced Resource Template module), those groups are used instead and only the labels from here apply."
elements.entry_sections.attributes.rows = 14

elements.lead_properties.name = "lead_properties"
elements.lead_properties.type = "Text"
elements.lead_properties.options.label = "Lead prose properties"
elements.lead_properties.options.info = "Comma-separated property terms whose values render as a full-width serif lead under the entry title instead of as a metadata row - for prose that is the entry's content rather than a record value. Applies only when no section lists the term: put it in a Groups section and it becomes an ordinary row again."
elements.lead_properties.attributes.value = "dcterms:description"

elements.external_link_properties.name = "external_link_properties"
elements.external_link_properties.type = "Text"
elements.external_link_properties.options.label = "Named external link properties"
elements.external_link_properties.options.info = "Comma-separated property terms whose URI values are shown as the site's name (detected from the host, e.g. \"NIST Digital Archives\") instead of a raw URL. Literal values are left as they are."
elements.external_link_properties.attributes.value = "dcterms:source"

elements.video_properties.name = "video_properties"
elements.video_properties.type = "Text"
elements.video_properties.options.label = "Video link properties"
elements.video_properties.options.info = "Comma-separated property terms whose URI value is a video of the entry (default foaf:page). The entry's plates then carry a VIDEO badge and a \"Play video\" link in the lightbox caption, both opening that URL in a new tab - the same treatment PDF plates get with their PDF badge and \"Open PDF\". The value is also shown as a named link in the record. Leave empty to turn the treatment off."
elements.video_properties.attributes.value = "foaf:page"

elements.repository_properties.name = "repository_properties"
elements.repository_properties.type = "Text"
elements.repository_properties.options.label = "Repository record properties"
elements.repository_properties.options.info = "Comma-separated property terms whose URI values link to the entry's record in an institutional repository. Shown as the repository's name (detected from the URI host, e.g. zora.uzh.ch) instead of the raw URL."
elements.repository_properties.attributes.value = "bibo:uri"

elements.bibliography_scope.name = "bibliography_scope"
elements.bibliography_scope.type = "Text"
elements.bibliography_scope.options.label = "Bibliographic entry for these item sets or templates"
elements.bibliography_scope.options.info = "Comma-separated item set titles or resource template labels. Matching entries are shown as a formatted citation (Bibliography module) in place of the title and the metadata table. Leave empty to show the normal entry layout everywhere."
elements.bibliography_scope.attributes.value = "References"

elements.citation_templates.name = "citation_templates"
elements.citation_templates.type = "Text"
elements.citation_templates.options.label = "Citation panel for these resource templates"
elements.citation_templates.options.info = "Comma-separated template labels. Only entries using one of them get the \"Cite this entry\" panel. Leave empty to show it on every entry."
elements.citation_templates.attributes.value = "Clock"

elements.essay_back_label.name = "essay_back_label"
elements.essay_back_label.type = "Text"
elements.essay_back_label.options.label = "Essay page: back link label"
elements.essay_back_label.options.info = "Fallback only. An essay normally takes its back link from its PARENT page in the site navigation (\"Back to essays\"), so this is used only for an essay that sits at the top level of the navigation or in none at all."
elements.essay_back_label.attributes.value = "Back to essays"

elements.facet_search_placeholder.name = "facet_search_placeholder"
elements.facet_search_placeholder.type = "Text"
elements.facet_search_placeholder.options.label = "Catalogue search placeholder"
elements.facet_search_placeholder.options.info = "Hint shown inside the full-text field of a Faceted Browse page."
elements.facet_search_placeholder.attributes.value = "e.g. ammonia"

elements.facet_counts.name = "facet_counts"
elements.facet_counts.type = "Checkbox"
elements.facet_counts.options.label = "Show counts next to facet values"
elements.facet_counts.options.info = "Counts are computed within the Faceted Browse page's own scope (e.g. the Clocks item set); they do not change when other facets are selected."
elements.facet_counts.attributes.value = 1

elements.eyebrow_templates.name = "eyebrow_templates"
elements.eyebrow_templates.type = "Text"
elements.eyebrow_templates.options.label = "Resource-type eyebrow for these templates"
elements.eyebrow_templates.options.info = "Comma-separated resource template labels OR item set titles whose entry pages show a small type label on the back-link baseline, each with an optional \" = Text\" when the label shown should differ from the name matched (the template is called Documentation; the reader should see DOCUMENT). Left off Clock on purpose: clocks are the catalogue's primary objects, so the label appears only when the reader has crossed into a different kind of record. Entries listed here also get the contextual back link (\"Back to <the entry that links here>\") when reached from one."
elements.eyebrow_templates.attributes.value = "Documentation = Document, References = Reference, Institutions = Institution"

elements.back_link_label.name = "back_link_label"
elements.back_link_label.type = "Text"
elements.back_link_label.options.label = "Entry page: back link label"
elements.back_link_label.options.info = "Shown above the entry (e.g. \"Back to Clocks\"). Leave empty to hide the link."
elements.back_link_label.attributes.value = "Back to the catalogue"

elements.back_link_url.name = "back_link_url"
elements.back_link_url.type = "Text"
elements.back_link_url.options.label = "Entry page: back link target"
elements.back_link_url.options.info = "Path relative to the site (e.g. \"faceted-browse/1\") or a full URL. Default: the site's first Faceted Browse page."

elements.hero_button_label.name = "hero_button_label"
elements.hero_button_label.type = "Text"
elements.hero_button_label.options.label = "Home hero: button label"
elements.hero_button_label.options.info = "Button under the hero text (\"Atlas hero\" block template). Its target is the entry page back-link target. Leave empty to hide."
elements.hero_button_label.attributes.value = "Browse the collection"

elements.citation_site_title.name = "citation_site_title"
elements.citation_site_title.type = "Text"
elements.citation_site_title.options.label = "Citation: publication title"
elements.citation_site_title.options.info = "Italic title used in citations. Defaults to the site title."

elements.footer_text.name = "footer_text"
elements.footer_text.type = "Text"
elements.footer_text.options.label = "Footer line"
elements.footer_text.attributes.value = "The Atomic Clock Atlas — an academic collaboration."

elements.footer_licence.name = "footer_licence"
elements.footer_licence.type = "Text"
elements.footer_licence.options.label = "Footer licence / right-hand text"
elements.footer_licence.attributes.value = "CC BY-NC 4.0"

elements.partner_logo_1.name = "partner_logo_1"
elements.partner_logo_1.type = "Omeka\Form\Element\Asset"
elements.partner_logo_1.options.label = "Partner logo 1"
elements.partner_logo_1.options.info = "Upload the official logo file (SVG or PNG). Shown in the footer."

elements.partner_logo_1_name.name = "partner_logo_1_name"
elements.partner_logo_1_name.type = "Text"
elements.partner_logo_1_name.options.label = "Partner 1 name (alt text)"

elements.partner_logo_1_url.name = "partner_logo_1_url"
elements.partner_logo_1_url.type = "Text"
elements.partner_logo_1_url.options.label = "Partner 1 link"

elements.partner_logo_2.name = "partner_logo_2"
elements.partner_logo_2.type = "Omeka\Form\Element\Asset"
elements.partner_logo_2.options.label = "Partner logo 2"
elements.partner_logo_2.options.info = "Upload the official logo file (SVG or PNG). Shown in the footer."

elements.partner_logo_2_name.name = "partner_logo_2_name"
elements.partner_logo_2_name.type = "Text"
elements.partner_logo_2_name.options.label = "Partner 2 name (alt text)"

elements.partner_logo_2_url.name = "partner_logo_2_url"
elements.partner_logo_2_url.type = "Text"
elements.partner_logo_2_url.options.label = "Partner 2 link"

resource_page_regions.items.main = "Metadata column (media is rendered by the theme in the specimen column; media blocks placed here are skipped)"
resource_page_regions.item_sets.main = "Main"
resource_page_regions.media.main = "Main"

resource_page_blocks.items.main[] = "values"
resource_page_blocks.items.main[] = "linkedResources"
resource_page_blocks.item_sets.main[] = "values"
resource_page_blocks.media.main[] = "mediaRender"
resource_page_blocks.media.main[] = "values"

block_templates.html.atlas-hero = "Atlas hero (engraving, centred text, button)"
block_templates.html.atlas-essay = "Atlas essay (running text)"
block_templates.html.atlas-essay-head = "Atlas essay byline (authors, affiliations, date, PDF)"
block_templates.html.atlas-bibliography = "Atlas bibliography (works cited in the essay above)"
block_templates.asset.atlas-plate = "Atlas plates (images with mono captions)"
block_templates.media.atlas-figure-margin = "Atlas figure — margin (380px, floats into the margin)"
block_templates.media.atlas-figure-text = "Atlas figure — text width"
block_templates.media.atlas-figure-page = "Atlas figure — page width (two attachments sit side by side)"
block_templates.browsePreview.atlas-entries = "Atlas entries (entry cards)"
